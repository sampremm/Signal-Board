name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend — Install, Lint, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Backend
        run: echo "No ESLint configured in server yet; assuming pass."

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          DIRECT_URL: "postgresql://mock:mock@localhost:5432/mock"

      - name: Generate Prisma client
        run: npm run build

  frontend-checks:
    name: Frontend — Install, Lint, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend
        run: echo "No ESLint configured in client yet; assuming pass."

      - name: Build Frontend (Vite + Tailwind CSS v4)
        run: npm run build

